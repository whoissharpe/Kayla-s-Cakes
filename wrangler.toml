# Cloudflare Pages configuration.
#
# The bindings below are what functions/ expects. In production these are also
# configured in the Pages dashboard (Settings -> Functions -> Bindings); this
# file is what makes `wrangler pages dev` and `wrangler d1 execute` work
# locally with the same names.

name = "kaylas-cakes"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "kaylas-cakes-leads"
# Replace with the real id printed by `wrangler d1 create kaylas-cakes-leads`.
# Only used for --remote commands; local dev ignores it.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kaylas-cakes-photos"
